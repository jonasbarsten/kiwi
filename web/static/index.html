<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B3A1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="kiwi">
<title>kiwi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'%3E%3Ccircle r='48' fill='%235B3A1E'/%3E%3Ccircle r='42' fill='%238DC63F'/%3E%3Ccircle r='13' fill='%23F3F0D7'/%3E%3C/svg%3E">
<style>
:root {
  --skin: #5B3A1E; --fuzz: #8A6A45; --flesh: #8DC63F; --flesh-hi: #C5E17A;
  --core: #F3F0D7; --seed: #1E1A14; --bg: #170f08; --card: #26180c; --line: #4a3420;
  --muted: #bcaa8a; --warn: #e8a33c; --bad: #e0573a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--core);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
}
header {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px; background: var(--skin);
  border-bottom: 3px solid var(--fuzz);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; }
.brand svg { width: 28px; height: 28px; }
.spacer { flex: 1; }
.stat { font-size: 14px; font-variant-numeric: tabular-nums; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.online { background: var(--flesh); }
.dot.offline { background: var(--bad); }
.dot.starting, .dot.idle { background: var(--warn); }
.dot.pulse { background: var(--flesh-hi); box-shadow: 0 0 0 3px rgba(197,225,122,.35); }
header button { min-height: 38px; padding: 0 12px; font-size: 15px; }
#panic { border-color: var(--bad); }
/* Map mode: controls stop moving and become targets; the chosen one waits for a CC. */
body.mapping main { cursor: pointer; }
body.mapping .row { position: relative; border-radius: 10px; outline: 1px dashed var(--fuzz); outline-offset: -1px; margin-top: 4px; }
body.mapping .row > input, body.mapping .row > .seg, body.mapping .row > select { pointer-events: none; opacity: .55; }
body.mapping .mappable { outline: 1px dashed var(--fuzz); outline-offset: 2px; }
body.mapping .morph input { pointer-events: none; opacity: .55; }
.row.learning, body.mapping .mappable.learning { outline: 3px solid var(--warn); animation: breathe 1s ease-in-out infinite alternate; }
@keyframes breathe { from { outline-color: var(--warn); } to { outline-color: var(--flesh-hi); } }
.row label small.map { color: var(--flesh-hi); }
.row .unmap { display: none; grid-area: value; justify-self: end; min-height: 36px; min-width: 36px; padding: 0 10px; font-size: 14px; }
body.mapping .row.mapped .unmap { display: inline-block; }
body.mapping .row.mapped output { display: none; }
/* Map mode is loud: amber header and page tint, a banner with Done, pulsing Map button. */
header { flex-wrap: wrap; }
#maphint { display: none; flex-basis: 100%; font-size: 15px; color: var(--seed); padding: 6px 0 2px; }
body.mapping #maphint { display: block; }
/* The host banner: the dot is easy to miss when mod-host restarts or the Wi-Fi drops. */
#hostbanner { display: none; flex-basis: 100%; font-size: 15px; padding: 8px 12px; border-radius: 10px; background: var(--bad); color: var(--core); }
#hostbanner.starting { background: var(--warn); color: var(--seed); }
#hostbanner.show { display: block; }
/* Collapsed sections carry their status (preset, reverb, envelope) on the summary line. */
details.card > summary .sum {
  margin-left: 10px; flex: 1; min-width: 0; font-weight: 400; font-size: 14px; letter-spacing: 0; text-transform: none;
  color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* The piano preset, with its ◀ ▶, lives in the Mix card: the thing changed most. */
.ppreset { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.ppreset span { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ppreset button { min-height: 36px; min-width: 40px; padding: 0 8px; font-size: 15px; }
/* ↺ on a row whose value differs from the patch: tap it to go back. */
.row label .revert { margin-left: 8px; min-height: 30px; min-width: 30px; padding: 0 7px; font-size: 14px; border-radius: 8px; vertical-align: middle; }
body.mapping .revert { display: none; }
.slots button span { display: flex; flex-direction: column; min-width: 0; }
.slots button small { font-size: 12px; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.slots button.on small { color: var(--seed); opacity: .75; }
body.mapping header { background: var(--warn); border-bottom-color: #b87a1c; color: var(--seed); }
body.mapping header button { background: var(--seed); color: var(--core); border-color: var(--seed); }
body.mapping #map { animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { from { box-shadow: 0 0 0 0 rgba(30,26,20,.6); } to { box-shadow: 0 0 0 6px rgba(30,26,20,0); } }
body.mapping { background: #2b1a06; }
body.mapping .card { border-color: var(--warn); }
body.mapping footer { background: var(--warn); color: var(--seed); border-top-color: #b87a1c; }
main {
  display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 1200px; margin: 0 auto;
  padding: 12px 12px calc(84px + env(safe-area-inset-bottom));
  align-items: start;   /* an expanded section must not stretch its neighbours */
}
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; }
.card h2, details.card > summary {
  margin: 0 0 6px; font-size: 14px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--flesh-hi);
}
.modes { display: grid; grid-template-columns: 1fr; gap: 10px; }
.mode { border-top: 1px solid var(--line); padding-top: 6px; }
.mode:first-child { border-top: 0; padding-top: 0; }
.mode h3 { margin: 0; font-size: 17px; }
/* Mobile first: label and value on one line, the control full width below it. */
.row {
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: "label value" "control control";
  align-items: center; column-gap: 10px; padding-top: 6px;
}
.row label { grid-area: label; font-size: 16px; overflow-wrap: anywhere; }
.row label small { margin-left: 8px; font-size: 12px; color: var(--muted); }
.row output { grid-area: value; text-align: right; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row > input, .row > .seg, .row > select { grid-area: control; }
.row.choice > .seg, .row.choice > select { margin: 4px 0 6px; }
.row.unknown output { color: var(--fuzz); }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 48px; margin: 0;
  background: transparent; touch-action: none; --fill: 0%;
}
input[type=range]:focus-visible { outline: 2px solid var(--flesh-hi); outline-offset: 2px; border-radius: 8px; }
input[type=range]::-webkit-slider-runnable-track {
  height: 10px; border-radius: 5px;
  background: linear-gradient(90deg, var(--flesh) var(--fill), var(--line) var(--fill));
}
input[type=range]::-moz-range-track { height: 10px; border-radius: 5px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 10px; border-radius: 5px; background: var(--flesh); }
/* The thumb is a kiwi slice: fuzzy rim, green flesh, cream core, a ring of seeds. */
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 32px; height: 32px; margin-top: -11px; border-radius: 50%;
  border: 3px solid var(--fuzz); background-color: var(--flesh);
  background-image:
    radial-gradient(circle, var(--core) 0 22%, transparent 23%),
    radial-gradient(circle, transparent 0 42%, var(--flesh) 43%),
    repeating-conic-gradient(var(--seed) 0 8deg, transparent 8deg 36deg),
    radial-gradient(circle, var(--flesh-hi) 0 45%, var(--flesh) 46%);
}
input[type=range]::-moz-range-thumb {
  width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--fuzz); background-color: var(--flesh);
  background-image:
    radial-gradient(circle, var(--core) 0 22%, transparent 23%),
    radial-gradient(circle, transparent 0 42%, var(--flesh) 43%),
    repeating-conic-gradient(var(--seed) 0 8deg, transparent 8deg 36deg),
    radial-gradient(circle, var(--flesh-hi) 0 45%, var(--flesh) 46%);
}
.unknown input[type=range]::-webkit-slider-thumb { opacity: .45; }
.unknown input[type=range]::-moz-range-thumb { opacity: .45; }
.blend-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: -8px 0 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
button, select {
  font: inherit; font-size: 16px; min-height: 44px; min-width: 44px; border-radius: 12px;
  border: 1px solid var(--fuzz); background: var(--skin); color: var(--core); padding: 0 14px;
}
button.on { background: var(--flesh); border-color: var(--flesh); color: var(--seed); font-weight: 700; }
select { width: 100%; }
.midi { display: flex; align-items: center; gap: 14px; }
.midi svg { width: 104px; height: 104px; flex: none; }
.seed { fill: var(--seed); transition: fill 80ms; }
.seed.on { fill: var(--core); }
.last { font-size: 15px; color: var(--muted); min-height: 2.8em; }
.ccs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-top: 10px; }
.cc { font-size: 12px; text-align: center; color: var(--muted); min-width: 0; }
.cc em { display: block; font-style: normal; font-size: 11px; color: var(--core); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc i { display: block; position: relative; height: 32px; border-radius: 6px; background: var(--line); overflow: hidden; margin-bottom: 2px; }
.cc i b { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--flesh); }
details.card > summary {
  list-style: none; display: flex; align-items: center; min-height: 44px; margin: -4px 0; cursor: pointer;
}
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: "+"; margin-left: auto; font-size: 24px; color: var(--core); }
details.card[open] > summary::after { content: "−"; }
details.card[open] > summary { margin-bottom: 6px; }
.group { margin: 10px 0 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.note { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 12px;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--skin);
  border-top: 3px solid var(--fuzz); font-size: 14px;
}
/* Preset bar: slot, name, prev/next, save, morph. Wraps on phones. */
.presets { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 14px; }
.presets .slot { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 0; }
.presets .slot .num {
  width: 44px; height: 44px; border-radius: 12px; background: var(--flesh); color: var(--seed);
  display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none;
}
.presets .slot input {
  flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--core); min-height: 44px;
}
.presets .nav { display: flex; gap: 6px; }
.presets .nav button { font-size: 22px; min-width: 52px; }
#save.on { background: var(--warn); border-color: var(--warn); color: var(--seed); }
.morph { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 0 14px 10px; }
.morph .target { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.slots[hidden] { display: none; }
.slots button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 0 12px; min-height: 48px; }
.slots button b { width: 28px; flex: none; }
.slots button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (min-width: 640px) { .slots { grid-template-columns: repeat(4, 1fr); } }
/* Pianoteq preset bar and browser (inside the Pianoteq section). */
.presets .pname { font-size: 17px; font-weight: 600; min-height: 44px; display: flex; align-items: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pbrowser { display: grid; gap: 8px; padding: 0 0 8px; }
.pbrowser input[type=search] {
  font: inherit; font-size: 16px; min-height: 44px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--core);
}
.plist { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; }
.prow { display: grid; grid-template-columns: 1fr 48px; gap: 6px; }
.prow button { text-align: left; min-height: 44px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow button:last-child { text-align: center; padding: 0; font-size: 20px; }
/* 640px: a phone held sideways already gets two columns. */
@media (min-width: 640px) {
  main { grid-template-columns: 1fr 1fr; padding-left: 16px; padding-right: 16px; }
  .modes { grid-template-columns: repeat(3, 1fr); }
  .mode { border-top: 0; padding-top: 0; }
  .wide { grid-column: 1 / -1; }
}
@media (min-width: 1100px) { main { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="-50 -50 100 100" aria-hidden="true"><circle r="48" style="fill:var(--fuzz)"/><circle r="42" style="fill:var(--flesh)"/><circle r="13" style="fill:var(--core)"/></svg>
    kiwi
  </div>
  <span class="dot" id="hostdot" title="audio host"></span>
  <span class="spacer"></span>
  <span class="stat" id="cpu">cpu –</span>
  <span class="stat" id="temp">–°C</span>
  <span class="dot" id="mididot" title="MIDI in"></span>
  <button type="button" id="map" aria-pressed="false">Map</button>
  <button type="button" id="panic" class="mappable">Panic</button>
  <div id="maphint" role="status"><span id="maptext">MAP MODE — tap a control, then move the knob or press the button on your controller.</span></div>
  <div id="hostbanner" role="status"></div>
</header>
<main id="main">
  <section class="card wide" style="padding: 0">
    <div class="presets">
      <div class="slot">
        <span class="num" id="slotnum">1</span>
        <input id="slotname" type="text" maxlength="40" autocomplete="off" aria-label="preset name">
      </div>
      <div class="nav">
        <button type="button" id="prev" class="mappable" aria-label="previous preset">◀</button>
        <button type="button" id="next" class="mappable" aria-label="next preset">▶</button>
        <button type="button" id="save" class="mappable">Save</button>
        <button type="button" id="slotsbtn" aria-label="all presets">☰</button>
      </div>
    </div>
    <div class="morph mappable" id="morphrow">
      <span class="target" id="morphlabel">morph</span>
      <input type="range" id="morph" min="0" max="1" step="0.001" value="0" aria-label="morph to next preset">
      <span class="target" id="morphto">→ 2</span>
    </div>
    <div class="slots" id="slots" hidden style="padding: 0 14px 14px"></div>
  </section>
  <section class="card wide">
    <h2>Mix</h2>
    <div class="modes" id="modes"></div>
    <div id="blend"></div>
  </section>
  <section class="card">
    <h2>MIDI in</h2>
    <div class="midi">
      <svg viewBox="-50 -50 100 100" id="slice" aria-hidden="true"></svg>
      <div class="last" id="last">no MIDI yet</div>
    </div>
    <div class="ccs" id="ccs"></div>
  </section>
</main>
<footer>
  <span id="saved">no unsaved changes</span>
</footer>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const SVG = 'http://www.w3.org/2000/svg';
const values = new Map();
const controls = new Map();
const pending = new Map();
let meta = null;
let source = null;
let dragging = null;
let flushTimer = null;

function keyOf(plugin, param) {
  if (param.cc !== undefined) return `cc:${param.cc}`;
  return plugin.kind === 'port'
    ? `port:${plugin.instance}:${param.symbol}`
    : `patch:${plugin.instance}:${param.uri}`;
}

function format(param, v) {
  if (v === null || v === undefined) return '–';
  if (param.type === 'toggle') return v >= 0.5 ? 'on' : 'off';
  if (param.options) {
    const option = param.options.find(([value]) => Math.abs(value - v) < 1e-6);
    if (option) return option[1];
  }
  if (param.type === 'int') return String(Math.round(v));
  const span = param.max - param.min;
  return span <= 2 ? v.toFixed(2) : span <= 200 ? v.toFixed(1) : String(Math.round(v));
}

// ----- CC mapping ------------------------------------------------------------------
// Targets mirror the server's: {kind:'port',instance,symbol} | {kind:'patch',instance,uri}
// | {kind:'cc',instance,number} | {kind:'action',name}.
let mappings = [];          // from map:mappings
let learning = null;        // from map:learning
let mapMode = false;
const actionTargets = { panic: 'panic', prev: 'slot_prev', next: 'slot_next', save: 'slot_save', morphrow: 'morph' };

function targetOf(control) {
  const { plugin, param } = control;
  if (param.cc !== undefined) return { kind: 'cc', instance: plugin.instance, number: param.cc };
  if (plugin.kind === 'port') return { kind: 'port', instance: plugin.instance, symbol: param.symbol };
  return { kind: 'patch', instance: plugin.instance, uri: param.uri };
}

function sameTarget(a, b) {
  return !!a && !!b && a.kind === b.kind && a.instance === b.instance && a.symbol === b.symbol
    && a.uri === b.uri && a.number === b.number && a.name === b.name;
}

function mappingFor(target) {
  return mappings.find((m) => sameTarget(m.target, target));
}

function ccLabel(mapping) {
  return `CC ${mapping.cc}${mapping.channel ? ` ch${mapping.channel + 1}` : ''}`;
}

const ACTION_LABELS = { panic: 'Panic', morph: 'Morph', slot_next: 'Next slot', slot_prev: 'Prev slot', slot_save: 'Save slot' };
const MIX_LABELS = { piano_vol: 'Piano vol', piano_send: 'Piano rev', sampler_vol: 'Sampler vol', sampler_send: 'Sampler rev',
                     vocoder_vol: 'Vocoder vol', vocoder_send: 'Vocoder rev' };

// A short human name for a mapping target, for the CC bars.
function targetLabel(target) {
  if (target.kind === 'action') return ACTION_LABELS[target.name] || target.name;
  if (target.kind === 'port' && target.instance === 5) return MIX_LABELS[target.symbol] || target.symbol;
  if (target.kind === 'port' && target.instance === 3) return 'Carrier';
  if (target.kind === 'port' && target.instance === REVERB_INSTANCE) {
    for (const r of meta.reverbs) {
      const param = r.params.find((p) => p.symbol === target.symbol);
      if (param) return `Reverb ${prettyName(param)}`;
    }
    return target.symbol;
  }
  const plugin = meta.plugins.find((p) => p.instance === target.instance);
  if (!plugin) return '?';
  const param = plugin.params.find((p) => target.kind === 'cc' ? p.cc === target.number
    : target.kind === 'port' ? p.symbol === target.symbol : p.uri === target.uri);
  return param ? prettyName(param) : '?';
}

function setMapMode(on) {
  mapMode = on;
  document.body.classList.toggle('mapping', on);
  $('map').classList.toggle('on', on);
  $('map').setAttribute('aria-pressed', String(on));
  if (!on && learning) post('/map/cancel');
}

function learn(target) {
  post('/map/learn', { target });
}

// In map mode a tap on a row or an action learns it. Opening and closing sections,
// the slot sheet and the preset browser still work; a tap on empty space (or Done /
// Map) ends map mode.
const NAVIGATION = '#map, summary, #slotsbtn, .pbrowser, .slots, .seg button[data-id]';
document.addEventListener('click', (event) => {
  if (!mapMode) return;
  if (event.target.closest(NAVIGATION)) return;
  const unmap = event.target.closest('.unmap');
  if (unmap) {
    event.stopPropagation();
    post('/map/remove', { target: JSON.parse(unmap.dataset.target) });
    return;
  }
  const row = event.target.closest('.row');
  if (row && row.dataset.key && controls.has(row.dataset.key)) {
    event.preventDefault();
    learn(targetOf(controls.get(row.dataset.key)));
    return;
  }
  const action = event.target.closest('.mappable');
  if (action && actionTargets[action.id]) {
    event.preventDefault();
    event.stopPropagation();
    learn({ kind: 'action', name: actionTargets[action.id] });
    return;
  }
  setMapMode(false);
}, true);

function renderMappings() {
  $('maptext').textContent = learning
    ? 'MAP MODE — waiting for a CC: move the knob or press the button on your controller…'
    : 'MAP MODE — tap a control, then move the knob or press the button on your controller.';
  for (const control of controls.values()) renderMapping(control);
  for (const [id, name] of Object.entries(actionTargets)) {
    const el = $(id);
    if (!el) continue;
    const target = { kind: 'action', name };
    el.classList.toggle('learning', sameTarget(learning, target));
    const mapping = mappingFor(target);
    el.title = mapping ? ccLabel(mapping) : '';
    if (id === 'morphrow') $('morphlabel').textContent = mapping ? `morph · ${ccLabel(mapping)}` : 'morph';
  }
  renderCcBars();
}

function renderMapping(control) {
  const { row } = control;
  const target = targetOf(control);
  const mapping = mappingFor(target);
  let small = row.querySelector('label small.map');
  if (mapping && !small) {
    small = document.createElement('small');
    small.className = 'map';
    row.querySelector('label').appendChild(small);
  }
  if (small) small.textContent = mapping ? ccLabel(mapping) : '';
  if (!mapping && small) small.remove();
  row.classList.toggle('mapped', !!mapping);
  row.classList.toggle('learning', sameTarget(learning, target));
  let unmap = row.querySelector('.unmap');
  if (mapping && !unmap) {
    unmap = document.createElement('button');
    unmap.type = 'button';
    unmap.className = 'unmap';
    unmap.textContent = '✕ unmap';
    unmap.setAttribute('aria-label', 'remove CC mapping');
    row.appendChild(unmap);
  }
  if (unmap) unmap.dataset.target = JSON.stringify(target);
  if (!mapping && unmap) unmap.remove();
}

// The "MIDI in" card shows a bar per mapped CC (channel-agnostic), named after what it drives.
function renderCcBars() {
  const numbers = [...new Set(mappings.map((m) => m.cc))].sort((a, b) => a - b);
  const box = $('ccs');
  box.replaceChildren();
  for (const cc of numbers) {
    const names = mappings.filter((m) => m.cc === cc).map((m) => targetLabel(m.target)).join(' + ');
    const cell = document.createElement('div');
    cell.className = 'cc';
    const bar = document.createElement('i');
    const fill = document.createElement('b');
    fill.id = `cc${cc}`;
    bar.appendChild(fill);
    const name = document.createElement('em');
    name.textContent = names;
    name.title = names;
    cell.append(bar, name, document.createTextNode(`CC ${cc}`));
    box.appendChild(cell);
  }
}

$('map').addEventListener('click', () => setMapMode(!mapMode));
$('panic').addEventListener('click', () => { if (!mapMode) post('/panic'); });

// Some plugins name a port by its symbol (EQ2_FREQ): show it as words instead.
function prettyName(param) {
  if (param.name !== param.symbol) return param.name;
  return param.symbol.replace(/_/g, ' ').toLowerCase().replace(/\b(rt60|eq|lf|hf|x)\b/g, (m) => m.toUpperCase())
    .replace(/^./, (c) => c.toUpperCase());
}

function makeControl(plugin, param, label) {
  const key = keyOf(plugin, param);
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.key = key;
  const lab = document.createElement('label');
  lab.textContent = label || prettyName(param);
  let input;
  let output = null;
  const choices = param.type === 'toggle'
    ? [[param.min, 'off'], [param.max, 'on']]
    : param.options;
  if (choices && choices.length <= 4) {
    row.classList.add('choice');
    input = document.createElement('div');
    input.className = 'seg';
    for (const [value, text] of choices) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = text;
      button.dataset.value = value;
      button.addEventListener('click', () => change(key, value));
      input.appendChild(button);
    }
  } else if (choices) {
    row.classList.add('choice');
    input = document.createElement('select');
    for (const [value, text] of choices) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = text;
      input.appendChild(option);
    }
    input.addEventListener('change', () => change(key, parseFloat(input.value)));
  } else {
    input = document.createElement('input');
    input.type = 'range';
    input.min = param.min;
    input.max = param.max;
    input.step = param.type === 'int' ? 1 : (param.max - param.min) / 1000;
    input.id = `c${controls.size}`;
    lab.htmlFor = input.id;
    input.addEventListener('pointerdown', () => { dragging = key; });
    input.addEventListener('pointerup', () => { if (dragging === key) dragging = null; });
    input.addEventListener('pointercancel', () => { dragging = null; });
    input.addEventListener('change', () => { if (dragging === key) dragging = null; });
    input.addEventListener('input', () => change(key, parseFloat(input.value)));
    output = document.createElement('output');
  }
  row.append(lab, input);
  if (output) row.append(output);
  const control = { key, row, input, output, param, plugin };
  controls.set(key, control);
  render(control);
  renderMapping(control);
  return row;
}

function render(control) {
  const { param, input, output, row } = control;
  const v = values.has(control.key) ? values.get(control.key) : null;
  row.classList.toggle('unknown', v === null);
  const span = Math.abs(param.max - param.min) || 1;
  const differs = v !== null && Math.abs(v - param.baseline) > span * 1e-4;
  row.classList.toggle('differs', differs);
  let revert = row.querySelector('label .revert');
  if (differs && !revert) {
    revert = document.createElement('button');
    revert.type = 'button';
    revert.className = 'revert';
    revert.textContent = '↺';
    revert.title = `back to ${format(param, param.baseline)}`;
    revert.setAttribute('aria-label', 'back to the patch value');
    revert.addEventListener('click', (event) => { event.preventDefault(); event.stopPropagation(); change(control.key, param.baseline); });
    row.querySelector('label').appendChild(revert);
  } else if (!differs && revert) {
    revert.remove();
  }
  if (input.tagName === 'INPUT') {
    const shown = v === null ? param.baseline : v;
    if (dragging !== control.key) input.value = shown;
    input.style.setProperty('--fill', `${((shown - param.min) / span) * 100}%`);
    output.textContent = format(param, v);
  } else if (input.tagName === 'SELECT') {
    if (v !== null) input.value = String(v);
  } else {
    for (const button of input.children) {
      button.classList.toggle('on', v !== null && Math.abs(parseFloat(button.dataset.value) - v) < 1e-6);
    }
  }
}

function setValue(key, v) {
  values.set(key, v);
  const control = controls.get(key);
  if (control) render(control);
}

// The renderers above run before `mappings` exists when the page builds: the map
// state arrives with the first event and re-renders everything.

// Changes are sent while dragging, at most every FAST_MS. Pianoteq and the reverb
// recompute inside the audio thread on every change, so they get SLOW_MS.
const FAST_MS = 50;
const SLOW_MS = 150;
const REVERB_INSTANCE = 6;
const lastSent = new Map();

function interval(control) {
  return control.plugin.kind === 'patch' || control.plugin.instance === REVERB_INSTANCE ? SLOW_MS : FAST_MS;
}

function change(key, v) {
  const control = controls.get(key);
  setValue(key, v);
  const item = { instance: control.plugin.instance, value: v };
  if (control.param.cc !== undefined) item.cc = control.param.cc;
  else if (control.plugin.kind === 'port') item.symbol = control.param.symbol;
  else item.uri = control.param.uri;
  pending.set(key, item);
  if (!flushTimer) flushTimer = setTimeout(flush, FAST_MS);
}

let inFlight = false;

async function flush() {
  flushTimer = null;
  // One request at a time, so an earlier value can never arrive after a later one.
  if (inFlight) {
    flushTimer = setTimeout(flush, FAST_MS);
    return;
  }
  const now = performance.now();
  const changes = [];
  for (const [key, item] of pending) {
    if (now - (lastSent.get(key) || 0) >= interval(controls.get(key))) {
      changes.push(item);
      lastSent.set(key, now);
      pending.delete(key);
    }
  }
  if (pending.size && !flushTimer) flushTimer = setTimeout(flush, FAST_MS);
  if (!changes.length) return;
  inFlight = true;
  try {
    await fetch('/set', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ changes }) });
  } catch (error) {
    setHost('unreachable');
  } finally {
    inFlight = false;
  }
}

// Sections: title, a status line that follows the state, and remembered open/closed.
const sections = new Map();     // title -> details
const OPEN_KEY = 'kiwi.open';

function storedOpen() {
  try { return JSON.parse(localStorage.getItem(OPEN_KEY)) || []; } catch (error) { return []; }
}

function rememberOpen() {
  try {
    localStorage.setItem(OPEN_KEY, JSON.stringify([...sections].filter(([, d]) => d.open).map(([t]) => t)));
  } catch (error) { /* private mode: nothing to remember */ }
}

function section(title, build, note) {
  const details = document.createElement('details');
  details.className = 'card';
  const summary = document.createElement('summary');
  const heading = document.createElement('span');
  heading.textContent = title;
  const status = document.createElement('span');
  status.className = 'sum';
  summary.append(heading, status);
  details.appendChild(summary);
  sections.set(title, details);
  if (note) {
    const p = document.createElement('p');
    p.className = 'note';
    p.textContent = note;
    details.appendChild(p);
  }
  details.addEventListener('toggle', () => {
    if (details.open && !details.dataset.built) {
      details.dataset.built = '1';
      build(details);
    }
    toggleRow(details);
    rememberOpen();
  });
  $('main').appendChild(details);
}

function restoreOpen() {
  const open = storedOpen();
  for (const [title, details] of sections) if (open.includes(title)) details.open = true;
}

// What each summary line says when the card is closed (and open: it does not hurt).
function renderSummaries() {
  const text = (title, value) => { const d = sections.get(title); if (d) d.querySelector('.sum').textContent = value || ''; };
  const reverb = meta.reverbs.find((r) => r.id === currentReverb);
  text('Reverb', reverb ? reverb.name : '');
  const preset = presetByUri(presetState.current);
  text('Pianoteq', preset ? `${preset.family} · ${preset.name}` : 'Pianoteq default');
  const env = [['A', 102], ['D', 103], ['S', 104], ['R', 105]]
    .filter(([, cc]) => values.has(`cc:${cc}`))
    .map(([letter, cc]) => `${letter} ${cc === 104 ? Math.round(values.get(`cc:${cc}`)) : values.get(`cc:${cc}`).toFixed(2)}`);
  text('Sampler', env.join(' '));
  if (values.has('port:7:threshold')) text('Limiter', `${values.get('port:7:threshold').toFixed(1)} dB`);
}

// Sections open and close per grid row: on a wide screen the cards beside the one
// you tapped follow it, so a row never shows one tall card next to collapsed stubs.
let rowToggling = false;
function toggleRow(details) {
  if (rowToggling) return;
  rowToggling = true;
  const top = details.getBoundingClientRect().top;
  for (const other of document.querySelectorAll('details.card')) {
    if (other !== details && Math.abs(other.getBoundingClientRect().top - top) < 2) other.open = details.open;
  }
  rowToggling = false;
}

function addGrouped(container, plugin, params) {
  let group = null;
  const sorted = [...params].sort((a, b) => (a.group || '').localeCompare(b.group || ''));
  for (const param of sorted) {
    if ((param.group || '') !== group) {
      group = param.group || '';
      if (group) {
        const heading = document.createElement('div');
        heading.className = 'group';
        heading.textContent = group;
        container.appendChild(heading);
      }
    }
    container.appendChild(makeControl(plugin, param));
  }
}

function build() {
  const plugin = (instance) => meta.plugins.find((p) => p.instance === instance);
  const mix = plugin(5);
  for (const [title, prefix] of [['Piano', 'piano'], ['Sampler', 'sampler'], ['Vocoder', 'vocoder']]) {
    const card = document.createElement('div');
    card.className = 'mode';
    const heading = document.createElement('h3');
    heading.textContent = title;
    card.appendChild(heading);
    for (const [suffix, label] of [['vol', 'Volume'], ['send', 'Reverb']]) {
      const param = mix.params.find((p) => p.symbol === `${prefix}_${suffix}`);
      if (param) card.appendChild(makeControl(mix, param, label));
    }
    if (prefix === 'piano' && presetList.length) card.appendChild(buildMixPreset());
    $('modes').appendChild(card);
  }
  const carrier = plugin(3);
  const blend = carrier.params.find((p) => p.symbol === 'blend');
  $('blend').appendChild(makeControl(carrier, blend, 'Vocoder carrier'));
  const labels = document.createElement('div');
  labels.className = 'blend-labels';
  for (const text of ['synth', 'piano', 'sampler']) {
    const span = document.createElement('span');
    span.textContent = text;
    labels.appendChild(span);
  }
  $('blend').appendChild(labels);
  renderMappings();

  if (meta.reverbs.length) section('Reverb', buildReverbSection);

  for (const p of meta.plugins) {
    if (p.instance === 5 || p.instance === 3) continue;
    if (p.kind === 'patch') {
      const note = 'Pianoteq cannot report its values: a slider shows one once set from this page.';
      section('Pianoteq', (d) => { buildPresetBar(d); addGrouped(d, p, p.params.filter((q) => q.curated)); }, note);
      section('Pianoteq · all parameters', (d) => addGrouped(d, p, p.params), note);
    } else {
      section(p.title, (d) => addGrouped(d, p, p.params));
    }
  }
  restoreOpen();
  renderSummaries();
}

// The current piano preset with ◀ ▶ inside the Mix card.
function buildMixPreset() {
  const box = document.createElement('div');
  box.className = 'ppreset';
  const prev = document.createElement('button');
  prev.type = 'button'; prev.textContent = '◀'; prev.setAttribute('aria-label', 'previous piano preset');
  prev.addEventListener('click', () => { if (!mapMode) stepPreset(-1); });
  const name = document.createElement('span');
  name.id = 'mixpreset';
  const next = document.createElement('button');
  next.type = 'button'; next.textContent = '▶'; next.setAttribute('aria-label', 'next piano preset');
  next.addEventListener('click', () => { if (!mapMode) stepPreset(1); });
  box.append(prev, name, next);
  return box;
}

// The reverb slot can hold any of meta.reverbs; its controls are rebuilt on a switch.
let currentReverb = null;
let reverbPicker = null;
let reverbBox = null;

function buildReverbSection(details) {
  reverbPicker = document.createElement('div');
  reverbPicker.className = 'seg';
  for (const r of meta.reverbs) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = r.name;
    button.dataset.id = r.id;
    button.addEventListener('click', () => chooseReverb(r.id));
    reverbPicker.appendChild(button);
  }
  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = 'Switching cuts the reverb tail for a moment. Each reverb keeps its own settings.';
  reverbBox = document.createElement('div');
  details.append(reverbPicker, note, reverbBox);
  renderReverb();
}

function renderReverb() {
  if (!reverbBox) return;
  for (const button of reverbPicker.children) button.classList.toggle('on', button.dataset.id === currentReverb);
  for (const key of [...controls.keys()]) {
    if (key.startsWith(`port:${REVERB_INSTANCE}:`)) controls.delete(key);
  }
  reverbBox.replaceChildren();
  const reverb = meta.reverbs.find((r) => r.id === currentReverb);
  if (reverb) addGrouped(reverbBox, { instance: REVERB_INSTANCE, kind: 'port', title: reverb.name }, reverb.params);
}

async function chooseReverb(id) {
  if (id === currentReverb) return;
  try {
    await fetch('/reverb', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                             body: JSON.stringify({ id }) });
  } catch (error) {
    setHost('unreachable');
  }
}

function drawSlice() {
  const svg = $('slice');
  const shape = (tag, attrs) => {
    const el = document.createElementNS(SVG, tag);
    for (const [name, value] of Object.entries(attrs)) el.setAttribute(name, value);
    svg.appendChild(el);
    return el;
  };
  shape('circle', { r: 48, style: 'fill:var(--fuzz)' });
  shape('circle', { r: 43, style: 'fill:var(--flesh)' });
  shape('circle', { r: 30, style: 'fill:var(--flesh-hi);opacity:.35' });
  shape('circle', { r: 13, style: 'fill:var(--core)' });
  for (let i = 0; i < 12; i++) {
    const angle = i * 30 - 90;
    const x = 23 * Math.cos(angle * Math.PI / 180);
    const y = 23 * Math.sin(angle * Math.PI / 180);
    shape('ellipse', { cx: x, cy: y, rx: 3, ry: 6, class: 'seed', id: `seed${i}`,
                       transform: `rotate(${angle + 90} ${x} ${y})` });
  }
}

function lightSeeds(notes) {
  const classes = new Set(notes.map((n) => n % 12));
  for (let i = 0; i < 12; i++) $(`seed${i}`).classList.toggle('on', classes.has(i));
}

const HOST_BANNERS = {
  starting: 'Audio host starting…',
  offline: 'Audio host offline — kiwi-host is restarting.',
  unreachable: 'No connection to kiwi — check the Wi‑Fi (the "kiwi" network) and reload.',
};

// `state` is what the Pi reports (online, idle, starting, offline); 'unreachable'
// is the page's own verdict when its requests fail.
function setHost(state) {
  $('hostdot').className = `dot ${state === 'unreachable' ? 'offline' : state}`;
  $('hostdot').title = `audio host: ${state}`;
  const banner = $('hostbanner');
  banner.textContent = HOST_BANNERS[state] || '';
  banner.className = HOST_BANNERS[state] ? `show ${state}` : '';
}

let midiPulse = null;
function pulseMidi() {
  $('mididot').classList.add('pulse');
  clearTimeout(midiPulse);
  midiPulse = setTimeout(() => $('mididot').classList.remove('pulse'), 150);
}

function apply(delta) {
  for (const [key, v] of Object.entries(delta)) {
    if (key.startsWith('port:') || key.startsWith('patch:') || key.startsWith('cc:')) {
      if (key !== dragging && !pending.has(key)) setValue(key, v);
    } else if (key === 'reverb:current') {
      if (v !== currentReverb) {
        currentReverb = v;
        renderReverb();
      }
    } else if (key === 'status:host') {
      setHost(v);
    } else if (key === 'status:cpu') {
      $('cpu').textContent = v === null ? 'cpu –' : `cpu ${v}%`;
    } else if (key === 'status:temp') {
      $('temp').textContent = v === null ? '–°C' : `${v}°C`;
    } else if (key === 'morph:value') {
      slotState[key] = v;
      renderMorph();              // every CC tick: only the slider, not the slot sheet
    } else if (key.startsWith('slot:')) {
      slotState[key] = v;
      renderSlots();
    } else if (key === 'preset:current') {
      presetState.current = v;
      renderPresetBar();
    } else if (key === 'preset:favourites') {
      presetState.favourites = v;
      renderPresetFamilies();
    } else if (key === 'map:mappings') {
      mappings = v;
      renderMappings();
    } else if (key === 'map:learning') {
      learning = v;
      renderMappings();
    } else if (key === 'midi:notes') {
      lightSeeds(v);
    } else if (key === 'midi:last') {
      $('last').textContent = v;
      pulseMidi();
    } else if (key.startsWith('midi:cc:')) {
      const bar = $(`cc${key.slice(8)}`);
      if (bar) bar.style.height = `${(v / 127) * 100}%`;
    }
  }
  if (meta) renderSummaries();
}

// A release outside the slider (mouse) must also end the drag, or that slider
// would keep ignoring knob moves.
window.addEventListener('pointerup', () => { dragging = null; });

function connect() {
  if (source || !meta) return;
  source = new EventSource('/events');
  source.onmessage = (event) => apply(JSON.parse(event.data));
  source.onerror = () => {
    setHost('unreachable');
    // EventSource retries by itself, except after an HTTP error (e.g. 503 when
    // too many viewers, or the server restarting): then reconnect ourselves.
    if (source && source.readyState === EventSource.CLOSED) {
      source = null;
      setTimeout(() => { if (!document.hidden) connect(); }, 2000);
    }
  };
}

function disconnect() {
  if (source) {
    source.close();
    source = null;
  }
}

document.addEventListener('visibilitychange', () => (document.hidden ? disconnect() : connect()));

// ----- presets --------------------------------------------------------------

const slotState = { 'slot:current': 1, 'slot:name': '', 'slot:names': [], 'slot:summaries': [], 'slot:dirty': false,
                    'morph:value': 0 };
let editingName = false;

async function post(path, body) {
  try {
    await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body || {}) });
  } catch (error) {
    setHost('unreachable');
  }
}

function renderMorph() {
  if (dragging !== 'morph') $('morph').value = slotState['morph:value'];
}

function renderSlots() {
  const current = slotState['slot:current'];
  const names = slotState['slot:names'];
  const total = (meta && meta.slots) || 8;
  $('slotnum').textContent = current;
  if (!editingName) $('slotname').value = slotState['slot:name'];
  $('save').classList.toggle('on', slotState['slot:dirty']);
  $('saved').textContent = slotState['slot:dirty'] ? 'unsaved changes (hold the button or tap Save)' : 'saved';
  const nextSlot = (current % total) + 1;
  $('morphto').textContent = `→ ${nextSlot}${names[nextSlot - 1] ? ' ' + names[nextSlot - 1] : ''}`;
  renderMorph();
  const box = $('slots');
  box.replaceChildren();
  for (let n = 1; n <= total; n++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.classList.toggle('on', n === current);
    const num = document.createElement('b');
    num.textContent = n;
    const name = document.createElement('span');
    name.textContent = names[n - 1] || `Preset ${n}`;
    const summary = slotState['slot:summaries'][n - 1];
    if (summary) {
      const preset = presetByUri(summary.preset);
      const reverb = meta && meta.reverbs.find((r) => r.id === summary.reverb);
      const detail = [preset ? preset.name : null, reverb ? reverb.name : null].filter(Boolean).join(' · ');
      if (detail) {
        const small = document.createElement('small');
        small.textContent = detail;
        name.appendChild(small);
      }
    }
    button.append(num, name);
    button.addEventListener('click', () => {
      if (n === current) return;
      if (slotState['slot:dirty'] && !confirm('Discard unsaved changes?')) return;
      post('/slot/select', { slot: n });
    });
    box.appendChild(button);
  }
}

// ◀/▶ sit next to Save on a phone: unsaved edits get a confirm here too.
function stepSlot(path) {
  if (mapMode) return;
  if (slotState['slot:dirty'] && !confirm('Discard unsaved changes?')) return;
  post(path);
}
$('prev').addEventListener('click', () => stepSlot('/slot/prev'));
$('next').addEventListener('click', () => stepSlot('/slot/next'));
$('save').addEventListener('click', () => { if (!mapMode) post('/slot/save'); });
$('slotsbtn').addEventListener('click', () => { $('slots').hidden = !$('slots').hidden; });
$('slotname').addEventListener('focus', () => { editingName = true; });
$('slotname').addEventListener('blur', () => { editingName = false; renderSlots(); });
$('slotname').addEventListener('change', () => {
  const name = $('slotname').value.trim();
  if (name) post('/slot/name', { name, slot: slotState['slot:current'] });
});
$('slotname').addEventListener('keydown', (event) => { if (event.key === 'Enter') $('slotname').blur(); });

let morphTimer = null;
$('morph').addEventListener('pointerdown', () => { dragging = 'morph'; });
$('morph').addEventListener('input', () => {
  if (morphTimer) return;
  morphTimer = setTimeout(() => { morphTimer = null; post('/morph', { value: parseFloat($('morph').value) }); }, 60);
});

// ----- Pianoteq presets --------------------------------------------------------

let presetList = [];          // from /presets.json: {uri, name, family, bundle}
const presetState = { current: null, favourites: [] };
let presetUi = null;          // {name, browser, family, search, list}

function presetByUri(uri) { return presetList.find((p) => p.uri === uri); }

function presetRing() {
  // What ◀ ▶ step through: the favourites, or the current preset's family, or all.
  if (presetState.favourites.length) return presetState.favourites;
  const current = presetByUri(presetState.current);
  const family = current ? presetList.filter((p) => p.family === current.family) : presetList;
  return family.map((p) => p.uri);
}

function stepPreset(delta) {
  const ring = presetRing();
  if (!ring.length) return;
  const at = ring.indexOf(presetState.current);
  const next = ring[(at < 0 ? (delta > 0 ? 0 : ring.length - 1) : (at + delta + ring.length) % ring.length)];
  post('/preset', { uri: next });
}

function buildPresetBar(container) {
  const bar = document.createElement('div');
  bar.className = 'presets';
  const slot = document.createElement('div');
  slot.className = 'slot';
  const name = document.createElement('span');
  name.className = 'pname';
  slot.appendChild(name);
  const nav = document.createElement('div');
  nav.className = 'nav';
  const prev = document.createElement('button');
  prev.type = 'button'; prev.textContent = '◀'; prev.setAttribute('aria-label', 'previous piano preset');
  prev.addEventListener('click', () => stepPreset(-1));
  const next = document.createElement('button');
  next.type = 'button'; next.textContent = '▶'; next.setAttribute('aria-label', 'next piano preset');
  next.addEventListener('click', () => stepPreset(1));
  const browse = document.createElement('button');
  browse.type = 'button'; browse.textContent = '☰'; browse.setAttribute('aria-label', 'browse piano presets');
  nav.append(prev, next, browse);
  bar.append(slot, nav);

  const browser = document.createElement('div');
  browser.className = 'pbrowser';
  browser.hidden = true;
  const family = document.createElement('select');
  const search = document.createElement('input');
  search.type = 'search'; search.placeholder = 'search presets'; search.setAttribute('aria-label', 'search presets');
  const list = document.createElement('div');
  list.className = 'plist';
  browser.append(family, search, list);
  browse.addEventListener('click', () => { browser.hidden = !browser.hidden; });
  family.addEventListener('change', renderPresetList);
  search.addEventListener('input', renderPresetList);

  const hint = document.createElement('p');
  hint.className = 'note';
  hint.textContent = '◀ ▶ step through starred presets (or the current family). The preset is saved with the slot.';
  container.append(bar, browser, hint);
  presetUi = { name, browser, family, search, list };
  renderPresetFamilies();
  renderPresetBar();
}

function renderPresetFamilies() {
  if (!presetUi) return;
  const families = [...new Set(presetList.map((p) => p.family))];
  presetUi.family.replaceChildren();
  const star = document.createElement('option');
  star.value = '★'; star.textContent = '★ favourites';
  presetUi.family.appendChild(star);
  for (const f of families) {
    const option = document.createElement('option');
    option.value = f; option.textContent = f;
    presetUi.family.appendChild(option);
  }
  const current = presetByUri(presetState.current);
  presetUi.family.value = presetState.favourites.length ? '★' : (current ? current.family : families[0] || '★');
  renderPresetList();
}

function renderPresetList() {
  if (!presetUi) return;
  const family = presetUi.family.value;
  const query = presetUi.search.value.trim().toLowerCase();
  let items = family === '★' ? presetState.favourites.map(presetByUri).filter(Boolean)
                             : presetList.filter((p) => p.family === family);
  if (query) items = presetList.filter((p) => `${p.family} ${p.name}`.toLowerCase().includes(query));
  presetUi.list.replaceChildren();
  for (const p of items.slice(0, 200)) {
    const row = document.createElement('div');
    row.className = 'prow';
    const pick = document.createElement('button');
    pick.type = 'button';
    pick.classList.toggle('on', p.uri === presetState.current);
    pick.textContent = query ? `${p.family} · ${p.name}` : p.name;
    pick.addEventListener('click', () => post('/preset', { uri: p.uri }));
    const star = document.createElement('button');
    star.type = 'button';
    const starred = presetState.favourites.includes(p.uri);
    star.textContent = starred ? '★' : '☆';
    star.classList.toggle('on', starred);
    star.setAttribute('aria-label', starred ? 'remove from favourites' : 'add to favourites');
    star.addEventListener('click', () => post('/favourite', { uri: p.uri, on: !starred }));
    row.append(pick, star);
    presetUi.list.appendChild(row);
  }
  if (!items.length) {
    const empty = document.createElement('p');
    empty.className = 'note';
    empty.textContent = family === '★' && !query ? 'No favourites yet: star presets in a family.' : 'Nothing found.';
    presetUi.list.appendChild(empty);
  }
}

function renderPresetBar() {
  const current = presetByUri(presetState.current);
  const text = current ? `${current.family} · ${current.name}` : 'Pianoteq default';
  if ($('mixpreset')) $('mixpreset').textContent = text;
  if (!presetUi) return;
  presetUi.name.textContent = text;
  renderPresetList();
}

function load() {
  fetch('/params.json')
    .then((response) => {
      if (!response.ok) throw new Error(`params.json: ${response.status}`);
      return response.json();
    })
    .then((data) => {
      meta = data;
      return fetch('/presets.json').then((r) => (r.ok ? r.json() : { presets: [] })).catch(() => ({ presets: [] }));
    })
    .then((data) => {
      presetList = data.presets || [];
      build();
      drawSlice();
      if (!document.hidden) connect();
    })
    .catch(() => {
      setHost('unreachable');
      setTimeout(load, 2000);
    });
}
load();
</script>
</body>
</html>
