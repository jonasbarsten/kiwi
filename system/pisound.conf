# Kiwi: the Pisound button selects and saves presets (see README, "Presets").
# Installed to /etc/pisound.conf by install.sh, replacing Patchbox's defaults.
# Saving happens from the DOWN/UP scripts (a timer that fires 3 s into a hold),
# so the HOLD_* events, which pisound-btn only reports on release, do nothing.
CLICK_1           /usr/local/bin/kiwi-btn-next
CLICK_2           /usr/local/bin/kiwi-btn-prev
CLICK_3           /usr/local/pisound/scripts/pisound-btn/do_nothing.sh
CLICK_OTHER       /usr/local/pisound/scripts/pisound-btn/do_nothing.sh
CLICK_COUNT_LIMIT 2
HOLD_1S           /usr/local/pisound/scripts/pisound-btn/do_nothing.sh
HOLD_3S           /usr/local/pisound/scripts/pisound-btn/do_nothing.sh
HOLD_5S           /usr/local/pisound/scripts/pisound-btn/do_nothing.sh
HOLD_OTHER        /usr/local/pisound/scripts/pisound-btn/do_nothing.sh
DOWN              /usr/local/bin/kiwi-btn-down
UP                /usr/local/bin/kiwi-btn-up
