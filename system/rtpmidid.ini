# Kiwi rtpmidid config: receive network MIDI only.
# Same as the package's default.ini minus two sections that export the Pi's own
# MIDI ports to the network: [alsa_hw_auto_export] (every hardware port, connected
# both ways) and [alsa_announce] (the "Network Export" port, which JACK subscribes
# to and which then shows up on the Mac as an extra "jack_midi-port" peer).
[general]
alsa_name=rtpmidid
control=/var/run/rtpmidid/control.sock

[rtpmidi_announce]
name={{hostname}}
port=5004

[rtpmidi_discover]
enabled=true
name_negative_regex=^$
name_positive_regex=.*
