# Kiwi rtpmidid config: receive network MIDI only.
# Same as the package's default.ini minus [alsa_hw_auto_export], which would
# export every local hardware port to the network and connect it both ways.
[general]
alsa_name=rtpmidid
control=/var/run/rtpmidid/control.sock

[rtpmidi_announce]
name={{hostname}}
port=5004

[rtpmidi_discover]
enabled=true
name_negative_regex=^$
name_positive_regex=.*

[alsa_announce]
name=Network Export
